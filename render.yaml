services:
  - type: web
    name: store-mo-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn store_mo.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: store-mo-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: store-mo-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://store-mo-frontend.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://store-mo-frontend.vercel.app

databases:
  - name: store-mo-db
    databaseName: store_mo
    plan: free
